name: Validate Tieba Source Leads
on:
  push:
    paths:
      - "sources/tieba/**"
      - "scripts/validate_tieba_sources.py"
      - ".github/workflows/validate-tieba-sources.yml"
  pull_request:
    paths:
      - "sources/tieba/**"
      - "scripts/validate_tieba_sources.py"
      - ".github/workflows/validate-tieba-sources.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate public source metadata
        run: python scripts/validate_tieba_sources.py
