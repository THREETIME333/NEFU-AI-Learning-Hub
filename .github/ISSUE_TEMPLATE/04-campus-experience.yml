name: 校园经验、建议或校规讨论（可由 AI 代填写）
description: 学长学姐分享经验、校园生活提醒、学生想法和校规讨论；提交后先审核，不会自动作为事实被 AI 引用
title: "[校园经验] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        本表单公开，GitHub 账号将显示。请不要提交姓名、学号、宿舍房号、联系方式、私人聊天、未授权课件等。AI 可以协助你整理，但必须经你同意才能投稿。
  - type: dropdown
    id: category
    attributes:
      label: 投稿类型
      options:
        - 学长学姐经验
        - 校园生活注意事项
        - 学生建议或点子
        - 校规理解与讨论
        - 学校官方公开规则链接
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: 适用范围与年份
      description: 例如某专业、某学年、某校区；不确定可以写“不确定”
      placeholder: 2026年某专业学生的个人经验
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: 想分享的经验、观点或问题
      description: 讲清楚你亲自经历了什么、你认为怎样更好。请区分事实和个人意见。
      placeholder: 这是我个人的体验……我建议……
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 可公开的依据与参考链接
      description: 涉及校规时请附公开官方原文和日期；个人经验可以注明“第一手经验，尚无官方来源”。
      placeholder: 官方 URL / 自己的亲身经历 / 暂无公开依据
    validations:
      required: true
  - type: checkboxes
    id: permission
    attributes:
      label: 发布确认
      options:
        - label: 我了解 GitHub Issue 公开且会显示账号；我有权公开提供的内容，并已去掉自己和他人的敏感信息。
          required: true
        - label: 我知道这只是待审核投稿，审核前不会成为 AI 学习知识库的可靠条目。
          required: true
