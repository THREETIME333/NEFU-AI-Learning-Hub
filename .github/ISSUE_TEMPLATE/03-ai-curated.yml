name: AI 整理的勘误提案
description: 由学习助手在学生明确同意后提交的脱敏修正
labels: []
body:
  - type: markdown
    attributes:
      value: "请不要提交姓名、学号、聊天全文、未授权试卷或密钥。AI 生成的建议必须带可核验依据。"
  - type: input
    id: target
    attributes:
      label: 精确文件路径与题号
      placeholder: "课程/数据结构/复习导航.md · Q003"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 问题与建议修正
      description: 只填写公开学习资料中的技术性错误，不上传整段私人对话
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证明、测试或可公开参考来源
    validations:
      required: true
  - type: checkboxes
    id: permission
    attributes:
      label: 投稿确认
      options:
        - label: 我有权分享上述内容，且不含个人信息和受限原题
          required: true
